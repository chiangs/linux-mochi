[project]
name = "mochi"
version = "1.1.0"
description = "A tiny pixel goo who lives at the bottom of your screen and talks to Claude Code for you (Linux / Wayland)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["PyGObject", "pycairo"]

[tool.ruff]

exclude = ["macos"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# the code keeps the original's compact style: several statements on a line, small lambdas
ignore = ["E401", "E501", "E701", "E702", "E731", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
